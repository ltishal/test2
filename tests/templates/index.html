/* NOTES — отдельная вкладка */
async function doNotes() {
  if (!state) return;
  const notes = (state.notes || []).map(note => ({...note}));

  const typeOrder = ['notification', 'letter', 'document', 'journal', 'note', 'rumor'];
  const types = [...new Set(notes.map(n => n.type || 'note'))].sort((a, b) => {
    const ia = typeOrder.indexOf(a); const ib = typeOrder.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  let activeFilter = 'all';

  function renderList() {
    const filtered = activeFilter === 'all' ? notes : notes.filter(n => (n.type || 'note') === activeFilter);
    const sorted = filtered.slice().sort((a, b) => {
      if (a.unread !== b.unread) return a.unread ? -1 : 1;
      return 0;
    });

    const counts = { all: notes.length };
    types.forEach(t => { counts[t] = notes.filter(n => (n.type || 'note') === t).length; });

    const tabsHtml = `
      <div class="note-tabs">
        <div class="note-tab ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">Все (${counts.all})</div>
        ${types.map(t => {
          const info = NOTE_TYPES[t] || NOTE_TYPES.note;
          return `<div class="note-tab ${activeFilter === t ? 'active' : ''}" data-filter="${t}">${info.icon} ${info.label} (${counts[t]})</div>`;
        }).join('')}
      </div>`;

    const listHtml = sorted.length ? sorted.map(n => {
      const info = NOTE_TYPES[n.type] || NOTE_TYPES.note;
      const unreadClass = n.unread ? 'unread' : '';
      const contentClass = n._expanded ? 'expanded' : '';
      const metaParts = [];
      if (n.source) metaParts.push(`от: ${esc(n.source)}`);
      if (n.date) metaParts.push(esc(n.date));
      return `
        <div class="note-card ${unreadClass}" data-id="${esc(n.id)}">
          <div class="note-header">
            <span class="note-title">${info.icon} ${esc(n.title || '(без названия)')}</span>
            <span class="note-type-badge">${info.label}</span>
          </div>
          ${metaParts.length ? `<div class="note-meta">${metaParts.join(' · ')}</div>` : ''}
          <div class="note-content ${contentClass}" data-content-id="${esc(n.id)}">${esc(n.content || '')}</div>
          <div class="note-actions">
            ${n.unread ? `<button class="note-action-btn" data-action="read" data-id="${esc(n.id)}">✓ Прочитано</button>` : ''}
            <button class="note-action-btn" data-action="delete" data-id="${esc(n.id)}">🗑 Удалить</button>
          </div>
        </div>`;
    }).join('') : '<div class="tag empty">нет заметок</div>';

    modalContent.innerHTML = `
      <h3>📝 Заметки</h3>
      ${tabsHtml}
      <div style="max-height:50vh;overflow-y:auto;margin-top:8px">${listHtml}</div>
      <button class="btn primary" style="margin-top:6px" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</button>`;

    // Обработчики
    modalContent.querySelectorAll('.note-tab').forEach(tab => {
      tab.onclick = () => { activeFilter = tab.dataset.filter; renderList(); };
    });
    modalContent.querySelectorAll('.note-card').forEach(card => {
      card.onclick = (e) => {
        // Клик по кнопке — обрабатываем отдельно
        if (e.target.closest('.note-action-btn')) return;
        const id = card.dataset.id;
        const note = notes.find(n => n.id === id);
        if (note) {
          note._expanded = !note._expanded;
          // Раскрытие = прочитано
          if (note.unread && !busy && !draftTurn) updateNote(id, 'read');
          else renderList();
        }
      };
    });
    modalContent.querySelectorAll('.note-action-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        updateNote(id, btn.dataset.action);
      };
    });
  }

  async function updateNote(id, action) {
    if (busy || draftTurn) return;
    setTurnBusy(true);
    try {
      await ensureParty();
      const snapshot = await partyRequest('/api/parties/' + partyRef.id + '/notes', {
        revision: partyRef.revision, id, action,
      });
      const expanded = new Set(notes.filter(note => note._expanded).map(note => note.id));
      useParty(snapshot);
      notes.splice(0, notes.length, ...(state.notes || []).map(note => ({
        ...note, _expanded: expanded.has(note.id),
      })));
      renderList();
      renderStatus();
    } catch (error) {
      addMsg('system', 'Не удалось обновить заметку: ' + error.message);
    } finally {
      setTurnBusy(false);
    }
  }

  renderList();
  modalEl.classList.add('open');
}

/* SKILLS */
function abilityName(value) {
  return String(value || '').replace(/&#(?:x([0-9a-f]+)|(\d+));|&nbsp;/gi, (_, hex, decimal) => {
    if (!hex && !decimal) return ' ';
    const point = hex ? parseInt(hex, 16) : Number(decimal);
    return point > 0 && point <= 0x10FFFF ? String.fromCodePoint(point) : '';
  }).replaceAll('**', '').trim().replace(/\s+/g, ' ');
}

function abilityUsage(ability) {
  const max = Number(ability.uses_max);
  const left = Number(ability.uses_left ?? max);
  if (ability.recharge === 'passive') return {kind: 'passive'};
  if (ability.mechanics?.dice && (ability.mechanics.cost > 0 || ability.mechanics.cooldown > 0)
      && (!Number.isInteger(max) || max <= 0)) return {kind: 'cast'};
  if (['unlimited', 'at_will'].includes(ability.recharge) || max < 0
      || (ability.uses_max == null && left < 0)) return {kind: 'unlimited'};
  if (!Number.isInteger(max) || max <= 0) return {kind: 'passive'};
  return {kind: 'limited', max, left: Number.isInteger(left) ? Math.min(max, Math.max(0, left)) : max};
}

async function doSkills() {
  if (!state) return;
  const prof = (state.proficiencies || []).length
    ? state.proficiencies.map(p => `<span class="tag">${esc(p)}</span>`).join('')
    : '<span class="tag empty">нет владений</span>';
  const skills = (state.skills || []).length
    ? state.skills.map(sk => {
        const bonus = sk.bonus >= 0 ? '+' + sk.bonus : '' + sk.bonus;
        return `<span class="tag skill" title="${esc(sk.source || '')}">${esc(sk.name)} ${bonus}</span>`;
      }).join('')
    : '<span class="tag empty">нет навыков</span>';
  function abilityCards(entries) {
    return entries.map(a => {
        const name = abilityName(a.name);
        const usage = abilityUsage(a);
        const isPassive = usage.kind === 'passive';
        const usesText = usage.kind === 'limited' ? usage.left + '/' + usage.max :
          usage.kind === 'unlimited' ? '∞' : '';
        const isEmpty = usage.kind === 'limited' && usage.left === 0;
        const rechargeLabel = {
          'passive': 'пассивное',
          'short_rest': 'короткий отдых',
          'long_rest': 'долгий отдых',
          'day': 'раз в день'
        }[usage.kind === 'limited' ? a.recharge : usage.kind] || '';
        const casting = usage.kind === 'cast' ? [
          a.mechanics.cost > 0 ? `Мана: ${a.mechanics.cost}` : '',
          a.mechanics.cooldown > 0 ? `Перезарядка: ${a.mechanics.cooldown} рд.` : ''
        ].filter(Boolean).join(' · ') : '';
        return `<div class="ability-card ${isPassive ? 'passive' : ''}">
          <div class="ability-header">
            <span class="ability-name">${esc(name)}</span>
            ${usesText ? '<span class="ability-uses ' + (isEmpty ? 'empty' : '') + '"'
              + (usage.kind === 'unlimited' ? ' aria-label="Без ограничений" title="Без ограничений"' : '')
              + '>' + usesText + '</span>' : ''}
          </div>
          <div class="ability-desc">${esc(name.toLowerCase() === 'второе дыхание' && /воин/i.test(state.class || '')
            ? 'Восстановить 1d10+' + (state.level || 1) + ' HP.' : a.description || 'Эффект не указан.')}</div>
          ${rechargeLabel ? `<div class="ability-recharge">⟳ ${esc(rechargeLabel)}</div>` : ''}
          ${casting ? `<div class="ability-recharge">${esc(casting)}</div>` : ''}
        </div>`;
      }).join('') || '<div class="tag empty">нет умений</div>';
  }
  const abilities = state.abilities || [];
  const passive = ability => abilityUsage(ability).kind === 'passive';
  modalContent.innerHTML = `
    <h3>🎯 ${esc(state.name || 'Пустой')} — Умения</h3>
    ${state.race || state.class || state.background ? `
      <div style="font-size:13px;color:var(--text-secondary)">
        ${[state.race, state.class, state.background].filter(Boolean).map(esc).join(' · ')}
      </div>
    ` : ''}
    <h3 style="margin-top:14px;font-size:15px">Активные умения</h3>
    <div>${abilityCards(abilities.filter(ability => !passive(ability)))}</div>
    ${abilities.some(passive) ? '<h3>Пассивные эффекты</h3><div>' + abilityCards(abilities.filter(passive)) + '</div>' : ''}
    <h3 style="margin-top:14px;font-size:15px">Пассивные навыки</h3>
    <div class="tags">${skills}</div>
    <h3 style="margin-top:14px;font-size:15px">Владения</h3>
    <div class="tags">${prof}</div>
    <button class="btn" style="margin-top:10px" onclick="document.getElementById('modal').classList.remove('open');doSheet();">📜 Полный лист</button>
    <button class="btn primary" style="margin-top:4px" onclick="document.getElementById('modal').classList.remove('open')">Закрыть</button>`;
  modalEl.classList.add('open');
}

/* ═══════════ СОХРАНЕНИЯ ═══════════ */

function fmtTime(ts) {
  if (!ts) return 'время неизвестно';
  const d = new Date(ts * 1000);
  if (isNaN(d.getTime())) return 'время неизвестно';
  const now = new Date();
  const time = d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
  if (d.toDateString() === now.toDateString()) return 'сегодня, ' + time;
  const yest = new Date(now);
  yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return 'вчера, ' + time;
  return d.toLocaleDateString('ru-RU', {day: '2-digit', month: '2-digit', year: 'numeric'})
         + ', ' + time;
}

function fmtSize(bytes) {
  if (!bytes && bytes !== 0) return '';
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' КБ';
  return (bytes / 1024 / 1024).toFixed(1) + ' МБ';
}

async function doSave(name) {
  if (busy || draftTurn) return;
  if (!name) {
    name = await promptModal('Название сохранения', 'game-' + Date.now());
    if (!name) return;
  }
  name = normalizeSaveName(name);
  if (!name) return addMsg('system', 'Введите имя сохранения буквами или цифрами.');
  // Если имя занято — спросим. Прежняя версия останется в .bak.json
  try {
    const r = await fetch('/api/saves');
    const list = await r.json();
    if (Array.isArray(list) && list.some(s => s.name === name)) {
      if (!confirm(`Сохранение «${name}» уже есть. Перезаписать?`)) return;
    }
  } catch (e) { /* список недоступен — просто сохраняем */ }

  try {
    await ensureParty();
    const res = await fetch('/api/save', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, ...partyPayload()})
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || 'не удалось сохранить');
    addMsg('system', `💾 Сохранено: «${d.name}»`);
  } catch(e) { addMsg('system', 'Ошибка сохранения: ' + e.message); }
}

function normalizeSaveName(name) {
  const normalized = name.normalize('NFC').replace(/(?<!\p{Nd})\.|\.(?!\p{Nd})/gu, '')
    .replace(/[^\p{L}\p{N} _.—–-]/gu, '').replace(/ +/g, ' ').trim();
  let bytes = 0;
  const encoder = new TextEncoder();
  const trimmed = [...normalized].filter(char => {
    bytes += encoder.encode(char).length;
    return bytes <= 128;
  }).join('').trim().replace(/\.+$/, '');
  return /[\p{L}\p{N}]/u.test(trimmed) ? trimmed : '';
}

/* Список сохранений: клик по имени — загрузить, ✎ — переименовать, 🗑 — удалить.
   Промис разрешается именем выбранного сохранения либо null. */
function savesModal() {
  return new Promise(resolve => {
    let items = [];
    let parties = [];
    let note = '';
    let closed = false;

    const finish = v => { if (!closed) { closed = true; modalEl.classList.remove('open'); resolve(v); } };

    async function refresh() {
      const [manual, automatic] = await Promise.allSettled([
        partyRequest('/api/saves'), partyRequest('/api/parties'),
      ]);
      items = manual.status === 'fulfilled' && Array.isArray(manual.value) ? manual.value : [];
      parties = automatic.status === 'fulfilled' && Array.isArray(automatic.value) ? automatic.value : [];
      if (manual.status === 'rejected' && automatic.status === 'rejected') note = 'Список временно недоступен.';
      render();
    }

    function render() {
      const rows = items.length ? items.map(s => `
        <div class="save-row">
          <div class="save-col">
            <div class="save-name" data-name="${esc(s.name)}" title="Нажмите, чтобы загрузить">${esc(s.name)}</div>
            <div class="save-meta">${esc(fmtTime(s.saved_at))}${s.size ? ' · ' + esc(fmtSize(s.size)) : ''}</div>
          </div>
          <button class="note-action-btn" data-act="rename" data-name="${esc(s.name)}" title="Переименовать">✎</button>
          <button class="note-action-btn" data-act="delete" data-name="${esc(s.name)}" title="Удалить">🗑</button>
        </div>`).join('') : '<div class="tag empty">нет сохранений</div>';

      const partyRows = parties.map(p => `
        <button type="button" class="btn party-choice" data-party="${esc(p.id)}">
          ${esc(p.name)}${p.location ? ' · ' + esc(p.location) : ''} · ${esc(fmtTime(p.updated_at))}
        </button>`).join('');
      modalContent.innerHTML = `
        <h3>📂 Сохранения</h3>
        ${note ? `<div class="save-note">${esc(note)}</div>` : ''}
        <div style="display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto">
          ${partyRows ? '<h4>Партии с автосохранением</h4>' + partyRows : ''}
          <h4>Именованные сохранения</h4>${rows}
        </div>
        <button class="btn primary" id="modal-cancel">Закрыть</button>`;
      modalEl.classList.add('open');

      modalContent.querySelectorAll('.party-choice').forEach(button => {
        button.onclick = () => finish({id: button.dataset.party});
      });
      modalContent.querySelectorAll('.save-name').forEach(el => {
        el.onclick = () => finish(el.dataset.name);
      });

      modalContent.querySelectorAll('[data-act]').forEach(btn => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const nm = btn.dataset.name;
          if (btn.dataset.act === 'rename') {
            const nn = await promptModal('Новое имя', nm);
            if (!nn || nn === nm) { note = ''; render(); return; }
            try {
              const r = await fetch('/api/save/rename', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: nm, new_name: nn})
              });
              const d = await r.json().catch(() => ({}));
              note = d.ok ? `Переименовано: «${nm}» → «${nn}»`
                          : 'Не удалось переименовать: ' + (d.error || ('HTTP ' + r.status));
            } catch (err) { note = 'Не удалось переименовать: ' + err.message; }
          } else {
            if (!confirm(`Удалить сохранение «${nm}»?\n\nЭто необратимо.`)) { note = ''; render(); return; }
            try {
              const r = await fetch('/api/save/delete', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: nm})
              });
              const d = await r.json().catch(() => ({}));
              note = d.ok ? `Удалено: «${nm}»`
                          : 'Не удалось удалить: ' + (d.error || ('HTTP ' + r.status));
            } catch (err) { note = 'Не удалось удалить: ' + err.message; }
          }
          await refresh();
        };
      });

      document.getElementById('modal-cancel').onclick = () => finish(null);
    }

    refresh();
  });
}

async function doLoad(name) {
  if (busy || draftTurn) return;
  if (!name) {
    name = await savesModal();
    if (!name || busy || draftTurn) return;
  }
  try {
    setTurnBusy(true);
    if (messages.length && partyRef?.revision == null) await ensureParty();
    const snapshot = typeof name === 'object'
      ? await partyRequest('/api/parties/' + name.id)
      : await importParty(await partyRequest('/api/load/' + encodeURIComponent(name)));
    resetSession();
    useParty(snapshot);
    redrawParty();
    addMsg('system', `📂 Загружено: «${typeof name === 'object' ? state.name || 'Новая партия' : name}»`);
  } catch(e) { addMsg('system', 'Ошибка: ' + e.message); }
  finally { setTurnBusy(false); }
}

/* ═══════════ ПЕРЕНОС ПАРТИИ ═══════════
   Переносит партию между браузерами и устройствами обычным текстом.
   Во встроенных браузерах (Telegram, Instagram) нет ни консоли,
   ни закладок, ни букмарклетов — а копирование текста работает везде.

   Переносятся обе части партии:
     messages — вся история ходов и ответов мастера
     state    — персонаж: имя, раса, класс, уровень, XP, HP,
                инвентарь, заметки, квесты, отношения. */

function doTransfer() {
  const current = JSON.stringify({messages, state, memory: partyMemory});
  const charName = (state && state.name) || 'Пустой';

  modalContent.innerHTML = `
    <h3>🔄 Перенос партии</h3>
    <div class="transfer-hint">
      <b>Сохранить копию:</b> нажмите «Скопировать» и вставьте текст в Заметки
      или отправьте себе в «Избранное».<br>
      <b>Загрузить:</b> вставьте текст в поле (или возьмите файл) и нажмите «Применить».
    </div>
    <textarea id="transfer-area" class="transfer-area" spellcheck="false"></textarea>
    <div id="transfer-info" class="transfer-info"></div>
    <div class="transfer-row">
      <button class="btn" id="transfer-copy">📋 Скопировать</button>
      <button class="btn" id="transfer-download">💾 Скачать файл</button>
    </div>
    <div class="transfer-row">
      <button class="btn" id="transfer-file-btn">📁 Из файла</button>
      <button class="btn primary" id="transfer-apply">✅ Применить</button>
    </div>
    <input type="file" id="transfer-file" accept=".json,application/json" style="display:none">
    <button class="btn" id="transfer-close">Закрыть</button>`;

  const area = document.getElementById('transfer-area');
  const info = document.getElementById('transfer-info');
  const fileInput = document.getElementById('transfer-file');
  area.value = current;

  const showInfo = (msg, warn) => {
    if (msg) {
      info.textContent = msg;
      info.className = 'transfer-info' + (warn ? ' warn' : '');
      return;
    }
    const kb = Math.max(1, Math.round(area.value.length / 1024));
    info.textContent =
      `В поле: ${kb} КБ. Текущая партия: сообщений ${messages.length}, ` +
      `персонаж «${charName}».`;
    info.className = 'transfer-info';
  };
  showInfo();
  area.addEventListener('input', () => showInfo());

  document.getElementById('transfer-close').onclick = () =>
    modalEl.classList.remove('open');

  document.getElementById('transfer-copy').onclick = async () => {
    const btn = document.getElementById('transfer-copy');
    area.focus();
    area.select();
    let ok = false;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(area.value);
        ok = true;
      }
    } catch (e) {}
    if (!ok) { try { ok = document.execCommand('copy'); } catch (e) {} }
    btn.textContent = ok ? '✓ Скопировано' : 'Скопируйте вручную';
    setTimeout(() => { btn.textContent = '📋 Скопировать'; }, 2000);
  };

  document.getElementById('transfer-download').onclick = () => {
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const blob = new Blob([area.value], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `rpg-${charName}-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };

  document.getElementById('transfer-file-btn').onclick = () => fileInput.click();

  fileInput.onchange = () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { area.value = String(reader.result || ''); showInfo(); };
    reader.readAsText(f);
  };

  document.getElementById('transfer-apply').onclick = async () => {
    if (busy || draftTurn) { showInfo('Дождитесь завершения хода.', true); return; }
    const raw = area.value.trim();
    if (!raw) { showInfo('Поле пустое.', true); return; }
    if (raw === current) { showInfo('Это ваша текущая партия — менять нечего.'); return; }

    let d;
    try {
      d = JSON.parse(raw);
    } catch (e) {
      showInfo('Текст повреждён или скопирован не полностью.', true);
      return;
    }
    if (!d || !Array.isArray(d.messages)) {
      showInfo('Это не похоже на партию: нет списка сообщений.', true);
      return;
    }
    const nm = (d.state && d.state.name) || 'Пустой';
    const lvl = (d.state && d.state.level) || 1;
    if (!confirm(`Заменить текущую партию?\n\n` +
                 `Загружаемая: «${nm}», уровень ${lvl}, сообщений ${d.messages.length}.\n` +
                 `Текущая партия останется в списке сохранений.`)) return;

    setTurnBusy(true);
    try {
      if (messages.length && partyRef?.revision == null) await ensureParty();
      const snapshot = await importParty(d);
      resetSession();
      useParty(snapshot);
      redrawParty();
      modalEl.classList.remove('open');
      addMsg('system', `🔄 Партия загружена: «${state.name || 'Пустой'}».`);
    } catch (error) {
      showInfo(error.message, true);
    } finally {
      setTurnBusy(false);
    }
  };

  modalEl.classList.add('open');
}

function doReset() {
  if (busy || draftTurn) return;
  openCharacterBuilder();
}

function doHelp() {
  addHtmlMsg('system', 'Команды:<br><code>/roll 1d20+3</code> — бросок<br>' +
    '<code>/cancel-check</code> — отказаться от необязательной проверки<br>' +
    '<code>/sheet</code> — полный лист<br><code>/skills</code> — умения и навыки<br>' +
    '<code>/notes</code> — заметки, письма, документы<br>' +
    '<code>/world</code> — энциклопедия открытого мира<br><code>/effects</code> — активные эффекты<br>' +
    '<code>/attack цель</code> — атака, <code>/attack цель | другая цель</code> — начать бой с несколькими противниками, <code>/cast умение | цель</code> — способность, <code>/guard</code> — защита, <code>/retreat</code> — отступление<br>' +
    '<code>/design</code> — проекты партии, <code>/design имя</code> — правила проекта, <code>/learn имя</code> — изучить способность<br>' +
    '<code>/equip предмет</code> — экипировать, <code>/wallet</code> — кошелёк, <code>/shop</code> — цены, <code>/buy товар | количество</code> — покупка, <code>/exchange gold 1 silver</code> — размен<br>' +
    '<code>/wait</code> — время и события. <code>/wait next</code> — до ближайшего события<br>' +
    '<code>/save имя</code> — сохранить<br><code>/load имя</code> — загрузить<br>' +
    '<code>/transfer</code> — перенос партии<br><code>/reset</code> — новая игра<br><br>' +
    'Заметки, письма, документы, слухи — в отдельной вкладке 📝, не в инвентаре.<br>' +
    'XP начисляется за убийства, победы без убийства и завершённые квесты.<br>' +
    'В окне загрузки можно переименовать (✎) и удалить (🗑) сохранение.<br>' +
    '🔄 Перенос партии — чтобы продолжить игру в другом браузере или на другом устройстве.');
}

function renderAll() {
  chatEl.innerHTML = '';
  messages.forEach(m => {
    if (m.role === 'user') {
      if (m.roll || m.content.startsWith('[[БРОСОК]]')) showRoll(m);
      else if (m.content === '/cancel-check') addMsg('user', 'Отказываюсь от проверки.');
      else addMsg('user', m.content.replace(/^\[\[СИСТЕМА\]\]\s*/, ''));
    } else if (m.role === 'assistant') {
      addMsg('master', m.content);
      if (m.resolution) addMsg('system', m.resolution);
    }
  });
  const lastMaster = [...messages].reverse().find(m => m.role === 'assistant');
  if (lastMaster) tts.lastText = lastMaster.content;
}
function showIntro() {
  const intro = addHtmlMsg('system',
    '<button type="button" class="btn primary">Создать персонажа</button><br><br>' +
    'Опишите героя в чате или откройте форму. Готовые миры доступны в меню.');
  intro.querySelector('button').onclick = () => openCharacterBuilder();
}
function renderWorlds() {
  const container = document.getElementById('worlds-section');
  if (!container) return;
  container.innerHTML = READY_WORLDS.map(w => `
    <button class="btn" data-world-id="${w.id}" title="${esc(w.desc)}">🌍 ${esc(w.name)}</button>
  `).join('');
  container.querySelectorAll('.btn').forEach(btn => {
    btn.onclick = () => {
      const world = READY_WORLDS.find(w => w.id === btn.dataset.worldId);
      if (!world || busy || draftTurn) return;
      drawerEl.classList.remove('open');
      drawerBg.classList.remove('open');
      openCharacterBuilder(world);
    };
  });
}

/* DICE MODAL */
function rollModal() {
  return new Promise(res => {
    const presets = ['1d4', '1d6', '1d8', '1d10', '1d12', '1d20', '2d6', '1d100'];
    modalContent.innerHTML = `<h3>🎲 Бросок кубика</h3>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${presets.map(p => `<button class="dice-preset" data-preset="${p}">${p}</button>`).join('')}
      </div>
      <input id="modal-input" type="text" value="1d20" placeholder="1d20+3">
      <div style="font-size:11px;color:var(--text-secondary)">Например, 2d6+1, 1d20-2 или 2d20kh1+1 с преимуществом</div>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" id="modal-cancel">Отмена</button>
        <button class="btn primary" style="flex:1" id="modal-ok">Бросить</button>
      </div>`;
    modalEl.classList.add('open');
    const inp = document.getElementById('modal-input');
    inp.focus(); inp.select();
    const close = v => { modalEl.classList.remove('open'); res(v); };
    modalContent.querySelectorAll('[data-preset]').forEach(b => {
      b.onclick = () => {
        inp.value = b.dataset.preset;
        modalContent.querySelectorAll('[data-preset]').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        inp.focus();
      };
    });
    document.getElementById('modal-cancel').onclick = () => close(null);
    document.getElementById('modal-ok').onclick = () => close(inp.value.trim() || null);
    inp.onkeydown = e => {
      if (e.key === 'Enter') close(inp.value.trim() || null);
      if (e.key === 'Escape') close(null);
    };
  });
}

function promptModal(title, ph) {
  return new Promise(res => {
    modalContent.innerHTML = `<h3>${title}</h3>
      <input id="modal-input" type="text" value="${esc(ph)}">
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" id="modal-cancel">Отмена</button>
        <button class="btn primary" style="flex:1" id="modal-ok">OK</button>
      </div>`;
    modalEl.classList.add('open');
    const inp = document.getElementById('modal-input');
    inp.focus(); inp.select();
    const close = v => { modalEl.classList.remove('open'); res(v); };
    document.getElementById('modal-cancel').onclick = () => close(null);
    document.getElementById('modal-ok').onclick = () => close(inp.value.trim() || null);
    inp.onkeydown = e => {
      if (e.key === 'Enter') close(inp.value.trim() || null);
      if (e.key === 'Escape') close(null);
    };
  });
}

function autosize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

inputEl.addEventListener('input', autosize);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(inputEl.value);
  }
});
sendBtn.onclick = () => sendMessage(inputEl.value);

document.querySelectorAll('.quick-btn').forEach(btn => {
  btn.onclick = () => {
    if (busy || draftTurn) return;
    const action = btn.dataset.quick;
    if (action && action.startsWith('/')) {
      const [c, ...r] = action.split(' ');
      handleCommand(c.toLowerCase(), c === '/roll' ? '' : r.join(' '));
    } else if (action) {
      sendMessage(action);
    }
  };
});

const quickCustomRoll = document.getElementById('quick-custom-roll');
if (quickCustomRoll) {
  quickCustomRoll.onclick = () => {
    if (busy || draftTurn) return;
    rollModal().then(v => { if (v) doRoll(v); });
  };
}

function fightTargetStatus(entity, location) {
  const states = {dead: 'Мёртв', defeated: 'Побеждён', unconscious: 'Без сознания', destroyed: 'Уничтожен'};
  if (Object.hasOwn(states, entity.life_state)) return states[entity.life_state];
  if (entity.hp === 0) return 'Побеждён';
  if (String(entity.location || '').toLocaleLowerCase('ru') !== location.toLocaleLowerCase('ru')) return 'Вне сцены';
  const status = String(entity.status || '').toLowerCase();
  if (/^(?:fled|сбежал|убежал|скрыл(?:ся|ась|ись)(?:$| (?:в лес|в чащ|между |среди ))|уш[её]л(?:$| (?:в лес|в чащ|из боя)))/i.test(status)) {
    return 'Сбежал';
  }
  return '';
}

document.getElementById('quick-attack').onclick = () => {
  if (busy || draftTurn || !gameAccess) return;
  const battle = state?.combat;
  const location = state?.scene?.location || '';
  const entities = state?.world_entities || [];
  const roster = Array.isArray(battle?.enemy_ids) ? battle.enemy_ids : battle?.target_id ? [battle.target_id] : [];
  const targets = roster.length
    ? roster.map(id => entities.find(entity => entity.id === id)).filter(Boolean)
    : entities.filter(entity => location && entity.location === location
        && ['npc', 'creature'].includes(entity.kind) && !fightTargetStatus(entity, location));
  if (!targets.length) return sendMessage('Я атакую ближайшего противника!');
  modalContent.innerHTML = '<h3>Цель атаки</h3>'
    + targets.map((entity, index) => {
      const status = fightTargetStatus(entity, location);
      const hp = Number.isInteger(entity.hp) ? ' · ' + esc(entity.hp) + '/' + esc(entity.max_hp) + ' HP' : '';
      return '<div><button class="btn" data-target="' + index + '"' + (status ? ' disabled' : '') + '>'
        + esc(entity.name) + hp + '</button>' + (status ? ' ' + esc(status) : '') + '</div>';
    }).join('')
    + '<button class="btn" id="target-cancel">Закрыть</button>';
  modalEl.classList.add('open');
  modalContent.querySelectorAll('[data-target]:enabled').forEach(button => {
    button.onclick = () => {
      modalEl.classList.remove('open');
      handleCommand('/attack', targets[Number(button.dataset.target)].id);
    };
  });
  modalContent.querySelector('#target-cancel').onclick = () => modalEl.classList.remove('open');
};

const menuButton = document.getElementById('menu-btn');
function setDrawer(open) {
  drawerEl.classList.toggle('open', open);
  drawerBg.classList.toggle('open', open);
  menuButton.setAttribute('aria-expanded', String(open));
}
menuButton.onclick = () => setDrawer(!drawerEl.classList.contains('open'));
drawerBg.onclick = () => setDrawer(false);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && drawerEl.classList.contains('open')) setDrawer(false);
});
document.querySelectorAll('#drawer .btn[data-action]').forEach(btn => {
  btn.onclick = () => {
    setDrawer(false);
    const a = btn.dataset.action;
    if (a === 'dice') doRoll();
    else if (a === 'dice-custom') rollModal().then(v => { if (v) doRoll(v); });
    else if (a === 'sheet') doSheet();
    else if (a === 'wait') showAgenda();
    else if (a === 'world') showWorldCodex();
    else if (a === 'effects') showActiveEffects();
    else if (a === 'skills') doSkills();
    else if (a === 'notes') doNotes();
    else if (a === 'save') doSave();
    else if (a === 'load') doLoad();
    else if (a === 'transfer') doTransfer();
    else if (a === 'reset') doReset();
    else if (a === 'help') doHelp();
  };
});

function init() {
  const saved = restore();
  if (saved && (saved.messages.length || saved.draftTurn || saved.partyRef)) {
    messages = saved.messages;
    partyRef = saved.partyRef || null;
    partyMemory = saved.partyMemory || null;
    draftTurn = saved.draftTurn || null;
    state = saved.state || {...EMPTY_STATE};
    // Совместимость
    if (!Array.isArray(state.relationships)) state.relationships = [];
    if (!Array.isArray(state.faction_clocks)) state.faction_clocks = [];
    if (!Array.isArray(state.dc_modifier_reasons)) state.dc_modifier_reasons = [];
    if (!Array.isArray(state.proficiencies)) state.proficiencies = [];
    if (!Array.isArray(state.skills)) state.skills = [];
    if (!Array.isArray(state.abilities)) state.abilities = [];
    if (!Array.isArray(state.level_history)) state.level_history = [];
    if (!Array.isArray(state.xp_event_ids)) state.xp_event_ids = [];
    if (typeof state.level_pending !== 'number') state.level_pending = 0;
    if (!Array.isArray(state.notes)) state.notes = [];
    if (typeof state.dc_modifier !== 'number') state.dc_modifier = 0;
    if (typeof state.race !== 'string') state.race = '';
    if (typeof state.class !== 'string') state.class = '';
    if (typeof state.background !== 'string') state.background = '';
    if (typeof state.position !== 'string') state.position = 'стоит';
    if (typeof state.cover !== 'string') state.cover = 'нет';
    if (typeof state.weapon_in_hand !== 'string') state.weapon_in_hand = '';
    if (typeof state.restrained !== 'boolean') state.restrained = false;
    if (Array.isArray(state.quests)) {
      state.quests = state.quests.map(q => {
        if (typeof q === 'string') {
          return { id: 'legacy-' + Math.random().toString(36).slice(2,8), name: q,
                   type: 'side', status: 'active', chain: '', chain_order: 0,
                   stages: [], current_stage: 0, rewards: {}, giver: '', location: '' };
        }
        return q;
      });
    } else {
      state.quests = [];
    }
    renderAll(); renderStatus();
    addMsg('system', '↩ История восстановлена. Продолжайте.');
    if (draftTurn) {
      if (draftTurn.action.roll) showRoll(draftTurn.action);
      renderDraft();
    }
    else renderPendingCheck();
    setTurnBusy(false);
  } else {
    state = {...EMPTY_STATE};
    renderStatus();
    showIntro();
  }
  renderWorlds();
  ttsLoad();
  autosize();
}
init();
refreshPresence().then(restoreServerParty);
setInterval(refreshPresence, 15000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshPresence();
});
</script>
